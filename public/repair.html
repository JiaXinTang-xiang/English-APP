<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#315c4e">
    <title>正在修复四级背词</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#eef4ef,#f8f3e8);color:#19352e;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.card{width:min(420px,100%);padding:32px 24px;text-align:center;background:#fff;border-radius:24px;box-shadow:0 18px 50px rgba(32,67,57,.1)}.mark{display:grid;place-items:center;width:60px;height:60px;margin:0 auto 18px;border-radius:18px;background:#315c4e;color:#fff;font-size:28px;font-weight:900}p{color:#687b75;line-height:1.7}button{display:none;width:100%;margin-top:18px;padding:14px;border:0;border-radius:14px;background:#315c4e;color:#fff;font:inherit;font-weight:800}
    </style>
  </head>
  <body>
    <main class="card"><div class="mark">词</div><h1>正在修复网页…</h1><p id="status">正在更新网页程序缓存，学习记录不会被删除。</p><button id="retry">返回四级背词</button></main>
    <script>
      const retry = document.querySelector('#retry');
      retry.addEventListener('click', () => location.replace('./?repaired=' + Date.now()));
      (async () => {
        try {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(registration => registration.unregister()));
          }
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.filter(key => key.startsWith('cet4-')).map(key => caches.delete(key)));
          }
          location.replace('./?repaired=' + Date.now());
        } catch {
          document.querySelector('#status').textContent = '自动修复未完成，请点击下方按钮返回。';
          retry.style.display = 'block';
        }
      })();
    </script>
  </body>
</html>
